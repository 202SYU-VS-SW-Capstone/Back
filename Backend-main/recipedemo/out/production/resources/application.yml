spring:
  datasource:
    url: jdbc:mysql://localhost:3306/saegil
    username: root
    password: 1868
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

  jwt:
    secret: saegil12345saegil12345saegil12345
    expiration: 3600000 # 1시간 (밀리초)

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: de86b2b2924f4a981f4bd9c9937219c4
            client-secret: "" # client-secret 없으면 빈 값
            redirect-uri: "http://localhost:8087/oauth2/callback/kakao"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8087

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
