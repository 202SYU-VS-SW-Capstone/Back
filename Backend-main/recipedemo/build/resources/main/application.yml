  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect # Dialect 설정


  jwt:
    secret: saegil12345saegil12345saegil12345
    expiration: 3600000 # 1시간 (밀리초)

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: de86b2b2924f4a981f4bd9c9937219c4
            client-secret: "" # client-secret 없으면 빈 값
            redirect-uri: "http://localhost:8080/oauth2/callback/kakao"
            authorization-grant-type: authorization_code
            scope:
#              - profile
#              - email
            - profile_nickname
            - profile_image
            - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

logging:
  level:
    org.springframework: DEBUG
