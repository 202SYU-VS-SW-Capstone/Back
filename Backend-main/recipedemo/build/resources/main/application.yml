spring:
  datasource:
    url: jdbc:mysql://localhost:3306/saegil?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: 1868
    driver-class-name: com.mysql.cj.jdbc.Driver


#  jpa:
#    hibernate:
#      ddl-auto: update
#    show-sql: true
#  sql:
#    init:
