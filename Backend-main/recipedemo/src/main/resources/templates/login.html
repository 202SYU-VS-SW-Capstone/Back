<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>카카오 로그인</title>
    <style>
        .kakao-login-btn {
            border: none;
            background: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>카카오 로그인</h1>
<!-- 카카오 로그인 버튼 -->

    <button class="kakao-login-btn">
        <!-- 카카오 로그인 이미지 -->
        <img src="/images/kakao_login_large_narrow.png" alt="카카오 로그인" />
    </button>
</form>
</body>
</html>
